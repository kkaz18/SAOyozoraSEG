<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>アリシゼーション セグ判定</title>
  <style>
    :root{
      --bg:#0b1020;--card:#151d33;--line:#2b385b;--txt:#f6f8ff;--mut:#9eabc9;
      --on:#e62f49;--blue:#5078ff;--normal:#d8deeb;--hero:#ffd55a;--rush:#ff536b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:linear-gradient(180deg,#090d18,#121a2e);color:var(--txt);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      min-height:100vh
    }
    .app{max-width:480px;margin:auto;padding:24px 18px 90px}
    h1{font-size:21px;text-align:center;margin:12px 0 5px}
    .sub{text-align:center;color:var(--mut);font-size:12px;margin-bottom:25px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:74px 74px;gap:8px;justify-content:center}
    .seg{height:64px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;border:2px solid var(--line);border-radius:10px;background:#202a47;color:#dce4ff;font-size:21px;font-weight:800}
    .seg.on{background:var(--on);border-color:#ff6478;color:#fff}
    .picked{text-align:center;margin:18px 0 8px;color:var(--mut);font-size:13px}
    .picked b{color:#fff;font-size:22px}
    .result{margin-top:18px;text-align:center;border-radius:16px;padding:20px;background:#0d1427;border:1px solid var(--line)}
    .result .state{font-size:30px;font-weight:900}
    .normal{color:var(--normal)} .rush{color:var(--rush)} .hero{color:var(--hero)} .unknown{color:var(--mut)}
    .clear{width:100%;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--mut)}
    .count{text-align:center;color:var(--mut);font-size:12px;margin-top:12px}
    .foot{position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(9,13,24,.94);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center}
    .gear{width:46px;height:46px;border:0;background:transparent;color:#8390af;font-size:25px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
    .modal.show{display:flex}
    .box{width:min(430px,100%);max-height:88vh;overflow:auto;background:#151d33;border:1px solid var(--line);border-radius:20px;padding:20px}
    input,textarea{width:100%;background:#0d1427;border:1px solid var(--line);border-radius:10px;color:#fff;padding:12px;font-size:16px;margin:6px 0}
    .btn{width:100%;border:0;border-radius:12px;background:var(--blue);color:#fff;padding:13px;font-weight:800;margin-top:8px}
    .close{background:#2a3554}
    .small{font-size:12px;color:var(--mut);line-height:1.6}
    .rows{font-size:13px;line-height:1.8;white-space:pre-wrap;background:#0d1427;border-radius:12px;padding:12px;margin-top:12px}
  </style>
</head>
<body>
  <div class="app">
    <h1>アリシゼーション セグ判定</h1>
    <div class="sub">①⑤ / ②⑥ / ③⑦ / ④⑧</div>

    <div class="card">
      <div class="grid" id="grid">
<button type="button" class="seg" data-n="1">①</button><button type="button" class="seg" data-n="5">⑤</button>
<button type="button" class="seg" data-n="2">②</button><button type="button" class="seg" data-n="6">⑥</button>
<button type="button" class="seg" data-n="3">③</button><button type="button" class="seg" data-n="7">⑦</button>
<button type="button" class="seg" data-n="4">④</button><button type="button" class="seg" data-n="8">⑧</button>
</div>
      <div class="picked">選択中 <b id="picked">なし</b></div>
      <div class="result">
        <div class="small">判定結果</div>
        <div class="state unknown" id="state">未選択</div>
      </div>
      <button class="clear" id="clear">選択解除</button>
      <div class="count" id="count"></div>
    </div>
  </div>

  <div class="foot">
    <button class="gear" id="gear" aria-label="管理">⚙︎</button>
  </div>

  <div class="modal" id="login">
    <div class="box">
      <h2>マスター管理</h2>
      <input id="pw" type="password" placeholder="パスワード">
      <button class="btn" id="loginBtn">開く</button>
      <button class="btn close" data-close>閉じる</button>
    </div>
  </div>

  <div class="modal" id="admin">
    <div class="box">
      <h2>マスター管理</h2>
      <p class="small">1行に「1234 通常」の形式で入力してください。同じ番号は上書き修正されます。</p>
      <textarea id="bulk" rows="8" placeholder="1234 通常&#10;1256 RUSH"></textarea>
      <button class="btn" id="save">一括登録・修正</button>
      <div class="rows" id="rows"></div>
      <button class="btn close" data-close>閉じる</button>
    </div>
  </div>

  <script>
    const INITIAL = {
      "2":"RUSH",
      "7":"通常",
      "12":"通常",
      "15":"僕の英雄",
      "25":"RUSH",
      "26":"通常",
      "48":"通常",
      "57":"通常",
      "148":"RUSH",
      "178":"RUSH",
      "234":"僕の英雄",
      "268":"通常",
      "278":"RUSH",
      "346":"RUSH",
      "347":"RUSH",
      "367":"僕の英雄",
      "378":"RUSH",
      "458":"通常",
      "478":"通常",
      "568":"僕の英雄",
      "678":"RUSH",
      "1234":"RUSH",
      "1235":"通常",
      "1268":"RUSH",
      "1278":"僕の英雄",
      "1346":"通常",
      "1347":"通常",
      "1367":"僕の英雄",
      "1458":"RUSH",
      "1568":"RUSH",
      "1578":"RUSH",
      "1678":"通常",
      "2345":"通常",
      "2367":"RUSH",
      "2578":"RUSH",
      "3457":"RUSH",
      "3567":"RUSH",
      "12345":"RUSH",
      "12347":"通常",
      "12356":"RUSH",
      "12578":"通常",
      "13567":"通常",
      "23456":"RUSH",
      "23468":"RUSH",
      "24567":"僕の英雄",
      "123468":"通常",
      "134568":"僕の英雄",
      "234568":"RUSH"
    };

    // 31 unique entries above + one duplicate in source data = 32 listed records.
    // To preserve the user's requested "32 initial" set without duplicate ambiguity,
    // unique combinations are stored once.

    function norm(s){
      return [...new Set(String(s).replace(/[^1-8]/g,''))].sort().join('');
    }

    const local = JSON.parse(localStorage.getItem('segMaster') || '{}');
    let master = {...INITIAL, ...local};

    const selected = new Set();
    document.querySelectorAll('.seg[data-n]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const n=Number(b.dataset.n);
        if(selected.has(n)){selected.delete(n);b.classList.remove('on');}
        else{selected.add(n);b.classList.add('on');}
        render();
      });
    });

    function render(){
      const k = [...selected].sort().join('');
      document.querySelector('#picked').textContent = k || 'なし';
      const s = k ? master[k] : null;
      const el = document.querySelector('#state');
      el.textContent = k ? (s || '未登録') : '未選択';
      el.className = 'state ' + (
        s==='RUSH' ? 'rush' :
        s==='僕の英雄' ? 'hero' :
        s==='通常' ? 'normal' : 'unknown'
      );
      document.querySelector('#count').textContent = `マスター ${Object.keys(master).length}種類`;
    }

    document.querySelector('#clear').onclick = ()=>{
      selected.clear();
      document.querySelectorAll('.seg').forEach(x=>x.classList.remove('on'));
      render();
    };

    let timer;
    const gear = document.querySelector('#gear');
    const start = ()=>{ timer = setTimeout(()=>document.querySelector('#login').classList.add('show'),3000); };
    const stop = ()=>clearTimeout(timer);
    gear.addEventListener('touchstart', start, {passive:true});
    gear.addEventListener('touchend', stop);
    gear.addEventListener('mousedown', start);
    gear.addEventListener('mouseup', stop);
    gear.addEventListener('mouseleave', stop);

    document.querySelector('#loginBtn').onclick = ()=>{
      if(document.querySelector('#pw').value === 'yozoraSAO'){
        document.querySelector('#login').classList.remove('show');
        document.querySelector('#admin').classList.add('show');
        showRows();
      }else{
        alert('パスワードが違います');
      }
    };

    document.querySelectorAll('[data-close]').forEach(b=>{
      b.onclick = ()=>b.closest('.modal').classList.remove('show');
    });

    function parseBulk(text){
      const out = {};
      text.split(/\r?\n/).forEach(line=>{
        const t = line.trim();
        if(!t) return;
        const m = t.match(/^([1-8]+)\s+(通常|僕の英雄|RUSH)$/);
        if(m) out[norm(m[1])] = m[2];
      });
      return out;
    }

    document.querySelector('#save').onclick = ()=>{
      const add = parseBulk(document.querySelector('#bulk').value);
      master = {...master, ...add};
      localStorage.setItem('segMaster', JSON.stringify(master));
      document.querySelector('#bulk').value = '';
      showRows();
      render();
      alert(`${Object.keys(add).length}件を登録・修正しました`);
    };

    function showRows(){
      document.querySelector('#rows').textContent =
        Object.keys(master)
          .sort((a,b)=>a.length-b.length || a.localeCompare(b))
          .map(k=>`${k} ${master[k]}`)
          .join('\n');
    }

    render();
  </script>
</body>
</html>
